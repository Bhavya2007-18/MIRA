[project]
name = "mira-ml"
version = "0.1.0"
description = "MIRA AI/ML Engine — Cognitive scoring, profiling, personalization, and memory prosthetic"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
mira-api = "mira_ml.api.app:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

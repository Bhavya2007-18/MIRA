[project]
name = "mira-ml"
version = "0.1.0"
description = "MIRA AI/ML Engine — Cognitive scoring, profiling, personalization, and memory prosthetic"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
